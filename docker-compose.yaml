services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    ports:
      - 5678:5678
    networks:
      - testing_net
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678

  client_0:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    networks:
      - testing_net
    volumes:
      - ./input:/input
      - ./output:/output
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=/input/input-0.csv
      - OUTPUT_FILE=/output/output-0.csv
      - BATCH_SIZE=8

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
